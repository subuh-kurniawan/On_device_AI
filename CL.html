    <style>
      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap");

      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        transition:
          background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      pre,
      code {
        font-family: "JetBrains Mono", monospace;
      }

      /* Custom Scrollbar minimalis ala Gemini */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.15);
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(156, 163, 175, 0.3);
      }

      .input-panel {
        background: linear-gradient(to top, #131314 60%, rgba(19, 19, 20, 0));
        padding-top: 24px;
        transition:
          background-color 0.4s,
          border-color 0.4s;
      }

      .sparkle-text {
        background: linear-gradient(
          74deg,
          #4285f4 0%,
          #9b72cb 30%,
          #d96570 70%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-size: 200% auto;
        animation: shine 6s linear infinite;
      }

      @keyframes shine {
        to {
          background-position: 200% center;
        }
      }

      .glowing-focus:focus-within {
        box-shadow: 0 0 25px rgba(66, 133, 244, 0.15);
        border-color: rgba(66, 133, 244, 0.35);
      }

      @keyframes glowPulse {
        0%,
        100% {
          box-shadow:
            0 0 8px rgba(138, 180, 248, 0.4),
            0 0 20px rgba(138, 180, 248, 0.2);
          border-color: rgba(138, 180, 248, 0.4);
        }
        50% {
          box-shadow:
            0 0 25px rgba(138, 180, 248, 0.9),
            0 0 45px rgba(66, 133, 244, 0.6);
          border-color: rgba(138, 180, 248, 1);
        }
      }

      .ai-loading-glow {
        animation: glowPulse 2s infinite ease-in-out;
        border-width: 1px;
      }

      body.light-theme {
        background-color: #f0f4f9;
        color: #1f1f1f;
      }
      .light-theme .sidebar {
        background-color: #f0f4f9;
        border-right: 1px solid #e3e3e3;
      }
      .light-theme .card-bg {
        background-color: #ffffff;
        border: 1px solid #e3e3e3;
      }
      .light-theme .chat-bubble-user {

        border-color: #d2e3fc;
      }
      .light-theme .chat-bubble-ai {
        background-color: transparent;
        color: #1f1f1f;
      }
      .chart-container {

        height: 300px;
        display: block;
        position: relative;
      }
      .table-wrapper {
        width: 100%;
        overflow-x: auto;
        margin: 12px 0;
        border-radius: 6px;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        background: #1e293b;
        color: #f1f5f9;
        border-radius: 6px;
        overflow: hidden;
        font-size: 14px;
      }
      table th {

        color: #fff;

        background: #475569;
      }

        background: transparent;

    <script>
      let db;
      let chatSession = null;
      let selectedFile = null;
      let aiSettings = {
        mode: "chrome",
        systemPrompt: "Anda adalah asisten AI.",
      };

      // Placeholder untuk mencegah error fungsi global yang terpanggil
      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("hidden");
      }
      function resetChat() {
        location.reload();
      }
      function closeSessionManagementModal() {
        document
          .getElementById("session-management-modal")
          .classList.add("hidden");
      }
      function openSessionManagementModal() {
        document
          .getElementById("session-management-modal")
          .classList.remove("hidden");
      }
      function closeAISettingsModal() {
        document.getElementById("ai-settings-modal").classList.add("hidden");
      }
      function openAISettingsModal() {

      function copyToClipboard(text, btn) {

      // Inisialisasi IndexedDB dan Aplikasi
      const request = indexedDB.open("GeminiChatDB", 3);
      request.onupgradeneeded = (e) => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains("history"))
          database.createObjectStore("history", {
            keyPath: "id",
            autoIncrement: true,
          });
        if (!database.objectStoreNames.contains("sessions"))
          database.createObjectStore("sessions", {
            keyPath: "id",
            autoIncrement: true,
          });
        if (!database.objectStoreNames.contains("settings"))
          database.createObjectStore("settings", { keyPath: "key" });
      };
      request.onsuccess = (e) => {
        db = e.target.result;
        initChatEngine();
      };

      async function initChatEngine() {
        try {
          if (window.ai && window.ai.languageModel) {
            chatSession = await window.ai.languageModel.create();
          }
        } catch (err) {
          console.warn("Chrome Built-in AI tidak aktif:", err);
        }
      }

      async function sendMessage() {
        const promptInput = document.getElementById("prompt");
        const text = promptInput.value.trim();
        if (!text && !selectedFile) return;

        const placeholder = document.getElementById("initial-placeholder");
        if (placeholder) placeholder.style.display = "none";

        renderMessage("user", text);
        promptInput.value = "";
        promptInput.style.height = "auto";

        const aiResponseId = renderMessage("ai", "Mengetik...");

        try {
          let responseText = "Maaf, AI lokal belum merespons.";
          if (chatSession) {
            const stream = await chatSession.promptStreaming(text);
            responseText = "";
            for await (const chunk of stream) {
              responseText = chunk;
              updateAiMessage(aiResponseId, responseText);
            }
          } else {
            responseText = "Simulasi AI: " + text;
            updateAiMessage(aiResponseId, responseText);
          }
        } catch (err) {
          updateAiMessage(aiResponseId, "Error: " + err.message);
        }
      }

      function renderMessage(role, text) {
        const messagesDiv = document.getElementById("messages");
        const msgId = "msg-" + Math.random().toString(36).substr(2, 9);
        const div = document.createElement("div");
        div.id = msgId;
        div.className =
          role === "user" ? "chat-bubble-user py-3" : "chat-bubble-ai py-3";

        const contentDiv = document.createElement("div");
        contentDiv.className = "text-sm leading-relaxed text-slate-200";
        contentDiv.innerHTML =
          role === "user" ? escapeHtml(text) : marked.parse(text);

        div.appendChild(contentDiv);
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return msgId;
      }

      function updateAiMessage(msgId, text) {
        const msgDiv = document.getElementById(msgId);
        if (msgDiv) {
          const contentDiv = msgDiv.querySelector("div");
          if (contentDiv) {
            contentDiv.innerHTML = marked.parse(text);
          }
        }
      }

      function escapeHtml(text) {
        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        };
        return text.replace(/[&<>"']/g, function (m) {
          return map[m];
        });
      }
